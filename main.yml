name: 🔁 Auto_Update_Playlist

on:
  schedule:
    - cron: "*/30 * * * *"  # প্রতি ৩০ মিনিট পর পর চলবে
  workflow_dispatch:       # আপনি নিজে ম্যানুয়ালি বোতাম চেপে রান করতে পারবেন

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📥 Install Requests
        run: pip install requests

      - name: ▶️ Run Generator
        run: python auto_generator.py  # আপনার ফাইলের নামের সাথে মিল রেখে

      - name: 💾 Save and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u8
          git commit -m "🔄 Auto-refresh: $(date)" || exit 0
          git push
