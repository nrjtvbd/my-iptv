name: 🔁 100% Auto Sync

on:
  schedule:
    - cron: "*/30 * * * *"  # প্রতি ৩০ মিনিট পর পর চেক করবে
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Requests
        run: pip install requests

      - name: Run Auto Generator
        run: python update.py

      - name: Push Updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playlist.m3u8
          git commit -m "🔄 Auto-refresh Token" || exit 0
          git push
